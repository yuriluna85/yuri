name: Rotina de Clipping & Varredura Histórica (yuri-main)

on:
  schedule:
    # Executa a cada 7 dias (toda segunda-feira às 09:00 UTC)
    - cron: '0 9 * * 1'

  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de Varredura'
        required: true
        default: 'forcado'
        type: choice
        options:
          - forcado
          - semanal
      max_paginas:
        description: 'Páginas de Busca do Google (Modo Forçado)'
        required: false
        default: '5'

jobs:
  clipping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Varredura de Menções
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          MODO_VARREDURA: ${{ github.event.inputs.modo || 'semanal' }}
          MAX_PAGINAS: ${{ github.event.inputs.max_paginas || '5' }}
        run: |
          python buscar_mencoes.py --modo ${{ env.MODO_VARREDURA }} --paginas ${{ env.MAX_PAGINAS }}

      - name: Salvar Alterações no GitHub
        run: |
          git config --global user.name "YLuna85 Bot"
          git config --global user.email "bot@yluna85.labs"
          git add data/ index.html style.css
          git diff --staged --quiet || git commit -m "🤖 [Auto] Clipping atualizado (${{ github.event.inputs.modo || 'semanal' }})"
          git push
