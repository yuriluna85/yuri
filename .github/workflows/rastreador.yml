name: Rotina Diária de Clipping & Varredura Histórica (yuri-main v4.0)

on:
  schedule:
    # Executa todos os dias às 06:10 BRT (09:10 UTC)
    - cron: '10 9 * * *'

  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de Varredura'
        required: true
        default: 'diario'
        type: choice
        options:
          - diario
          - historico
      max_paginas:
        description: 'Páginas de Busca (Modo Histórico)'
        required: false
        default: '5'

jobs:
  clipping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Varredura de Menções
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          MODO_VARREDURA: ${{ github.event.inputs.modo || 'diario' }}
          MAX_PAGINAS: ${{ github.event.inputs.max_paginas || '5' }}
        run: |
          python buscar_mencoes.py --modo ${{ env.MODO_VARREDURA }} --paginas ${{ env.MAX_PAGINAS }}

      - name: Salvar Alterações no GitHub
        run: |
          git config --global user.name "YLuna85 Bot"
          git config --global user.email "bot@yluna85.labs"
          git add data/ index.html style.css
          git diff --staged --quiet || git commit -m "🤖 [Auto] Clipping diário atualizado (${{ github.event.inputs.modo || 'diario' }})"
          git push
